spring.application.name=cadus
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:9867/cadus
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
server.tomcat.max-http-form-post-size=12MB
server.tomcat.max-swallow-size=12MB

app.public-url=http://localhost:8080

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=

app.minio.endpoint=http://localhost:9000
app.minio.access-key=
app.minio.secret-key=
app.minio.bucket=cadus
app.minio.region=us-east-1
app.minio.url-ttl=12h
